<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Aut Driftowych</title>
<style>
:root{
  --bg:#15171b;
  --panel:#1c1f24;
  --panel-2:#22262c;
  --line:#2c3038;
  --text:#e9e7e1;
  --text-dim:#9a9fa8;
  --text-faint:#666c76;
  --amber:#d98e2b;
  --amber-dim:#8a6224;
  --owned:#4c8c7a;
  --owned-bg:#1c2b26;
  --planned-bg:#2a2620;
  --sindgrid:#c96b6b;
  --ingrid:#6b9ec9;
  --astrid:#a889d1;
  --radius:4px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{
  display:flex;
  min-height:100vh;
}
/* ---------- SIDEBAR ---------- */
.sidebar{
  width:230px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.brand{
  font-size:15px;
  font-weight:700;
  letter-spacing:0.2px;
  color:var(--text);
  margin:2px 4px 4px 4px;
}
.brand-sub{
  font-size:11.5px;
  color:var(--text-faint);
  margin:0 4px 18px 4px;
}
.nav-group-label{
  font-size:11px;
  color:var(--text-faint);
  margin:16px 8px 6px 8px;
}
.nav-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:7px 10px;
  border-radius:var(--radius);
  cursor:pointer;
  color:var(--text-dim);
  border:1px solid transparent;
  transition:background .12s ease, color .12s ease;
}
.nav-item:hover{
  background:var(--panel-2);
  color:var(--text);
}
.nav-item.active{
  background:var(--panel-2);
  color:var(--text);
  border-color:var(--line);
}
.nav-item .dot{
  width:7px;height:7px;border-radius:50%;
  flex-shrink:0;
  background:var(--text-faint);
}
.nav-item-label{
  display:flex;
  align-items:center;
  gap:8px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.nav-item .count{
  font-size:11.5px;
  color:var(--text-faint);
  flex-shrink:0;
}
.nav-item.active .count{color:var(--text-dim);}

/* ---------- MAIN ---------- */
.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.topbar{
  padding:22px 28px 16px 28px;
  border-bottom:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:14px;
}
.topbar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.view-title{
  font-size:19px;
  font-weight:700;
  margin:0;
}
.view-sub{
  font-size:12.5px;
  color:var(--text-faint);
  margin-top:2px;
}
.stats{
  display:flex;
  gap:18px;
}
.stat{
  text-align:right;
}
.stat-num{
  font-size:18px;
  font-weight:700;
}
.stat-label{
  font-size:11px;
  color:var(--text-faint);
}
.controls-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.search-box{
  flex:1;
  min-width:180px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:8px 12px;
  color:var(--text);
  font-size:13.5px;
  outline:none;
}
.search-box::placeholder{color:var(--text-faint);}
.search-box:focus{border-color:var(--amber-dim);}
.filter-pill{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:8px 10px;
  color:var(--text-dim);
  font-size:13px;
  cursor:pointer;
}
.filter-pill.active{
  border-color:var(--amber-dim);
  color:var(--amber);
}
select.filter-pill{
  -webkit-appearance:none;
  appearance:none;
}

/* ---------- TABLE ---------- */
.table-wrap{
  flex:1;
  overflow:auto;
  padding:0 28px 28px 28px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
}
thead th{
  position:sticky;
  top:0;
  background:var(--bg);
  text-align:left;
  font-size:11px;
  font-weight:600;
  color:var(--text-faint);
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
tbody tr:hover{background:var(--panel);}
.car-name{font-weight:600;color:var(--text);}
.car-notes{
  color:var(--text-faint);
  font-size:12px;
  max-width:260px;
}
.cat-chip{
  display:inline-block;
  font-size:11.5px;
  color:var(--text-dim);
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:3px 8px;
  white-space:nowrap;
}
.rating{
  color:var(--amber);
  font-variant-numeric:tabular-nums;
  font-weight:600;
}
.status-btn{
  font-size:12px;
  font-weight:600;
  border-radius:var(--radius);
  padding:5px 10px;
  cursor:pointer;
  border:1px solid transparent;
  white-space:nowrap;
}
.status-btn.planned{
  background:var(--planned-bg);
  color:var(--amber);
  border-color:var(--amber-dim);
}
.status-btn.owned{
  background:var(--owned-bg);
  color:var(--owned);
  border-color:var(--owned);
}
.assign-select{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  color:var(--text-dim);
  font-size:12.5px;
  padding:5px 6px;
  outline:none;
  min-width:104px;
}
.assign-select.sindgrid{color:var(--sindgrid);border-color:var(--sindgrid);}
.assign-select.ingrid{color:var(--ingrid);border-color:var(--ingrid);}
.assign-select.astrid{color:var(--astrid);border-color:var(--astrid);}
.empty-state{
  padding:60px 20px;
  text-align:center;
  color:var(--text-faint);
}
.reset-link{
  font-size:11.5px;
  color:var(--text-faint);
  cursor:pointer;
  text-decoration:underline;
  margin-top:auto;
  padding:8px;
}
.reset-link:hover{color:var(--text-dim);}
.wiki-link{
  font-size:12px;
  color:var(--text-faint);
  text-decoration:none;
  border-bottom:1px dotted var(--text-faint);
  white-space:nowrap;
}
.wiki-link:hover{color:var(--amber);border-color:var(--amber);}

/* ---------- GUIDE VIEW ---------- */
.guide-view{
  padding:24px 28px 40px 28px;
  max-width:820px;
  overflow-y:auto;
}
.guide-intro{
  color:var(--text-dim);
  font-size:13.5px;
  margin-bottom:24px;
  max-width:640px;
}
.guide-section{
  margin-bottom:26px;
  padding-bottom:22px;
  border-bottom:1px solid var(--line);
}
.guide-section:last-child{border-bottom:none;}
.guide-section h3{
  font-size:15px;
  margin:0 0 4px 0;
  color:var(--amber);
}
.guide-section .guide-tag{
  display:inline-block;
  font-size:11px;
  font-weight:600;
  color:var(--owned);
  background:var(--owned-bg);
  border:1px solid var(--owned);
  border-radius:var(--radius);
  padding:2px 8px;
  margin-bottom:10px;
}
.guide-section p{
  font-size:13.5px;
  color:var(--text);
  line-height:1.6;
  margin:6px 0;
}
.guide-table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}
.guide-table th{
  text-align:left;
  font-size:11px;
  color:var(--text-faint);
  padding:6px 8px;
  border-bottom:1px solid var(--line);
}
.guide-table td{
  padding:7px 8px;
  border-bottom:1px solid var(--line);
  color:var(--text-dim);
  vertical-align:top;
}
.guide-table td:first-child{color:var(--text);font-weight:600;white-space:nowrap;}
.guide-list{
  margin:8px 0 0 0;
  padding-left:18px;
  color:var(--text-dim);
  font-size:13.5px;
  line-height:1.7;
}
.guide-list li strong{color:var(--text);}
.save-indicator{
  font-size:11px;
  color:var(--text-faint);
  opacity:0;
  transition:opacity .3s ease;
}
.save-indicator.show{opacity:1;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

.car-name-btn{
  background:none;border:none;padding:0;margin:0;
  font:inherit;font-weight:600;color:var(--text);
  cursor:pointer;text-align:left;
}
.car-name-btn:hover{color:var(--amber);text-decoration:underline;}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(10,11,13,0.72);
  display:none;
  align-items:center;justify-content:center;
  padding:20px;
  z-index:100;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  width:100%;
  max-width:620px;
  max-height:88vh;
  overflow-y:auto;
  padding:24px 26px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:4px;
}
.modal-title{
  font-size:19px;
  font-weight:700;
  margin:0;
}
.modal-close{
  background:none;border:none;color:var(--text-faint);
  font-size:20px;cursor:pointer;line-height:1;padding:2px 4px;
}
.modal-close:hover{color:var(--text);}
.modal-cat{
  font-size:12.5px;color:var(--text-faint);margin-bottom:18px;
}
.modal-photo-link{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:var(--panel-2);
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:34px 16px;
  color:var(--text-dim);
  text-decoration:none;
  font-size:13px;
  margin-bottom:18px;
  text-align:center;
}
.modal-photo-link:hover{border-color:var(--amber-dim);color:var(--amber);}
.modal-photo-link .photo-icon{
  width:34px;height:34px;
  opacity:.55;
}
.modal-photo-link .photo-cta{
  font-weight:600;
  color:var(--amber);
}
.modal-photo-img{
  width:100%;
  border-radius:var(--radius);
  border:1px solid var(--line);
  margin-bottom:18px;
  display:block;
}
.modal-section{
  margin-bottom:16px;
}
.modal-section-label{
  font-size:11px;
  color:var(--text-faint);
  margin-bottom:5px;
}
.modal-section-body{
  font-size:13.5px;
  color:var(--text);
}
.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:16px;
}
.livery-yes{color:var(--owned);font-weight:600;}
.livery-no{color:var(--text-dim);}
.modal-footnote{
  font-size:11px;
  color:var(--text-faint);
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--line);
}

@media (max-width:760px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px;gap:8px;}
  .brand,.brand-sub,.nav-group-label,.reset-link{display:none;}
  .nav-item{flex-shrink:0;}
  .topbar{padding:16px;}
  .table-wrap{padding:0 12px 20px 12px;}
  .car-notes{display:none;}
}
</style>
</head>

<div class="app">

      <div class="brand-sub">Plan budowy driftowego garażu</div>
    </div>

    <div class="nav-group-label">Kategorie</div>
    <div id="nav-categories"></div>

    <div class="nav-group-label">Przypisania</div>

        </div>
      </div>
      <div class="controls-row" id="controls-row">
        <input type="text" class="search-box" id="search" placeholder="Szukaj po nazwie lub opisie...">
        <select class="filter-pill" id="status-filter">

          <option value="Planowany">Planowany</option>
          <option value="Owned">Owned</option>

          <option value="brand">Marka (A-Z)</option>
          <option value="rating-desc">Ocena: najwyższa → najniższa</option>
        </select>
        <span class="save-indicator" id="save-indicator">Zapisano</span>
      </div>
    </div>

    <div class="table-wrap" id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Pojazd</th>
            <th>Kategoria</th>
            <th>Ocena</th>
            <th>Status</th>
            <th>Przypisz do</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none;">Brak pojazdów spełniających kryteria.</div>
    </div>

    <div class="guide-view" id="guide-view" style="display:none;"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

const OWNERS = ["Sindgrid", "Ingrid", "Astrid"];
const OWNER_CLASS = {Sindgrid:"sindgrid", Ingrid:"ingrid", Astrid:"astrid"};
const STORAGE_KEY = "car-tracker-state-v1";

let state = {}; // { [carId]: { status, owner } }
let currentFilter = { type: "all", value: null }; // type: all | category | owner | livery | tag
let searchTerm = "";
let statusFilter = "all";
let sortBy = "default";
let showGuide = false;

function defaultEntry(car){
  return { status: car.status === "Planowany" ? "Planowany" : "Planowany", owner: null };
}

function getEntry(car){
  if(!state[car.id]) state[car.id] = defaultEntry(car);
  return state[car.id];
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      state = JSON.parse(res.value);
    }
  }catch(e){
    state = {};
  }
}

let saveTimer = null;
function persistState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      const ind = document.getElementById("save-indicator");
      ind.classList.add("show");
      setTimeout(()=>ind.classList.remove("show"), 900);
    }catch(e){
      console.error("Nie udało się zapisać stanu", e);
    }
  }, 250);
}

function getCategories(){
  const set = [];
  CARS.forEach(c => { if(!set.includes(c.category)) set.push(c.category); });
  return set;
}

function countForCategory(cat){
  return CARS.filter(c => c.category === cat).length;
}
function countForOwner(owner){
  return CARS.filter(c => getEntry(c).owner === owner).length;
}
function countOwnedTotal(){
  return CARS.filter(c => getEntry(c).status === "Owned").length;
}
function hasLivery(car){
  const info = LOOKUP[car.name];
  return info && info.livery && info.livery.startsWith("Tak");
}
function hasTag(car, tag){
  const info = LOOKUP[car.name];
  return info && Array.isArray(info.tags) && info.tags.includes(tag);
}

function renderSidebar(){
  const allWrap = document.getElementById("nav-all");
  allWrap.innerHTML = "";
  const allItem = document.createElement("div");
  allItem.className = "nav-item" + (currentFilter.type === "all" ? " active" : "");
  allItem.innerHTML = `<span class="nav-item-label"><span class="dot" style="background:var(--amber)"></span>Wszystkie</span><span class="count">${CARS.length}</span>`;
  allItem.onclick = () => { currentFilter = {type:"all", value:null}; showGuide = false; render(); };
  allWrap.appendChild(allItem);

  const catWrap = document.getElementById("nav-categories");
  catWrap.innerHTML = "";
  getCategories().forEach(cat => {
    const item = document.createElement("div");
    const active = currentFilter.type === "category" && currentFilter.value === cat;
    item.className = "nav-item" + (active ? " active" : "");
    item.innerHTML = `<span class="nav-item-label"><span class="dot"></span>${cat}</span><span class="count">${countForCategory(cat)}</span>`;
    item.onclick = () => { currentFilter = {type:"category", value:cat}; showGuide = false; render(); };
    catWrap.appendChild(item);
  });

  const ownerWrap = document.getElementById("nav-owners");
  ownerWrap.innerHTML = "";
  OWNERS.forEach(owner => {
    const item = document.createElement("div");
    const active = currentFilter.type === "owner" && currentFilter.value === owner;
    item.className = "nav-item" + (active ? " active" : "");
    const colorVar = `var(--${OWNER_CLASS[owner]})`;
    item.innerHTML = `<span class="nav-item-label"><span class="dot" style="background:${colorVar}"></span>${owner}</span><span class="count">${countForOwner(owner)}</span>`;
    item.onclick = () => { currentFilter = {type:"owner", value:owner}; showGuide = false; render(); };
    ownerWrap.appendChild(item);
  });

  const specialWrap = document.getElementById("nav-special");
  specialWrap.innerHTML = "";
  const liveryCount = CARS.filter(c => hasLivery(c)).length;
  const liveryItem = document.createElement("div");
  const liveryActive = currentFilter.type === "livery";
  liveryItem.className = "nav-item" + (liveryActive ? " active" : "");
  liveryItem.innerHTML = `<span class="nav-item-label"><span class="dot" style="background:var(--owned)"></span>Z okleinami</span><span class="count">${liveryCount}</span>`;
  liveryItem.onclick = () => { currentFilter = {type:"livery", value:null}; showGuide = false; render(); };
  specialWrap.appendChild(liveryItem);

  const TAG_LABELS = { drift: "Pod drift", street: "Pod wyścig uliczny", offroad: "Pod offroad" };
  Object.keys(TAG_LABELS).forEach(tag => {
    const count = CARS.filter(c => hasTag(c, tag)).length;
    const item = document.createElement("div");
    const active = currentFilter.type === "tag" && currentFilter.value === tag;
    item.className = "nav-item" + (active ? " active" : "");
    item.innerHTML = `<span class="nav-item-label"><span class="dot"></span>${TAG_LABELS[tag]}</span><span class="count">${count}</span>`;
    item.onclick = () => { currentFilter = {type:"tag", value:tag}; showGuide = false; render(); };
    specialWrap.appendChild(item);
  });
}

function visibleCars(){
  let list = CARS.slice();
  if(currentFilter.type === "category"){
    list = list.filter(c => c.category === currentFilter.value);
  }else if(currentFilter.type === "owner"){
    list = list.filter(c => getEntry(c).owner === currentFilter.value);
  }else if(currentFilter.type === "livery"){
    list = list.filter(c => hasLivery(c));
  }else if(currentFilter.type === "tag"){
    list = list.filter(c => hasTag(c, currentFilter.value));
  }
  if(statusFilter !== "all"){
    list = list.filter(c => getEntry(c).status === statusFilter);
  }
  if(searchTerm.trim()){
    const t = searchTerm.trim().toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(t) || c.notes.toLowerCase().includes(t) || c.category.toLowerCase().includes(t));
  }
  if(sortBy === "name"){
    list.sort((a,b) => a.name.localeCompare(b.name));
  }else if(sortBy === "brand"){
    list.sort((a,b) => a.brand.localeCompare(b.brand) || a.name.localeCompare(b.name));
  }else if(sortBy === "rating-desc"){
    list.sort((a,b) => b.rating - a.rating);
  }
  return list;
}

function renderTitle(){
  const title = document.getElementById("view-title");
  const sub = document.getElementById("view-sub");
  if(currentFilter.type === "all"){
    title.textContent = "Wszystkie pojazdy";
    sub.textContent = "Pełny katalog kandydatów do driftowego garażu";
  }else if(currentFilter.type === "category"){
    title.textContent = currentFilter.value;
    sub.textContent = "Kategoria z oryginalnego katalogu";
  }else if(currentFilter.type === "owner"){
    title.textContent = currentFilter.value;
    sub.textContent = "Pojazdy przypisane do tej osoby";
  }else if(currentFilter.type === "livery"){
    title.textContent = "Z okleinami";
    sub.textContent = "Pojazdy z dostępnym pakietem oklein / widebody (np. Benny's)";
  }else if(currentFilter.type === "tag"){
    const TAG_LABELS = { drift: "Pod drift", street: "Pod wyścig uliczny", offroad: "Pod offroad" };
    const TAG_SUB = {
      drift: "Pojazdy RWD dobrze przystosowane do driftu",
      street: "Pojazdy AWD/FWD lub o dużej mocy, lepsze do wyścigów ulicznych z przyczepnością",
      offroad: "Pojazdy terenowe / 4x4, lepsze poza asfaltem"
    };
    title.textContent = TAG_LABELS[currentFilter.value];
    sub.textContent = TAG_SUB[currentFilter.value];
  }
}

function renderStats(list){
  document.getElementById("stat-total").textContent = list.length;
  document.getElementById("stat-owned").textContent = list.filter(c => getEntry(c).status === "Owned").length;
  document.getElementById("stat-assigned").textContent = list.filter(c => getEntry(c).owner).length;
}

function renderTable(){
  const list = visibleCars();
  const tbody = document.getElementById("table-body");
  const emptyState = document.getElementById("empty-state");
  tbody.innerHTML = "";

  if(list.length === 0){
    emptyState.style.display = "block";
  }else{
    emptyState.style.display = "none";
  }

  list.forEach(car => {
    const entry = getEntry(car);
    const tr = document.createElement("tr");

    const tdName = document.createElement("td");
    const nameBtn = document.createElement("button");
    nameBtn.className = "car-name-btn";
    nameBtn.textContent = car.name;
    nameBtn.onclick = () => openModal(car);
    tdName.appendChild(nameBtn);
    tr.appendChild(tdName);

    const tdCat = document.createElement("td");
    tdCat.innerHTML = `<span class="cat-chip">${car.category}</span>`;
    tr.appendChild(tdCat);

    const tdRating = document.createElement("td");
    tdRating.innerHTML = `<span class="rating">${car.rating.toFixed(1)}</span>`;
    tr.appendChild(tdRating);

    const tdStatus = document.createElement("td");
    const isOwned = entry.status === "Owned";
    const btn = document.createElement("button");
    btn.className = "status-btn " + (isOwned ? "owned" : "planned");
    btn.textContent = isOwned ? "Owned" : "Planowany";
    btn.onclick = () => {
      entry.status = isOwned ? "Planowany" : "Owned";
      persistState();
      render();
    };
    tdStatus.appendChild(btn);
    tr.appendChild(tdStatus);

    const tdAssign = document.createElement("td");
    const sel = document.createElement("select");
    sel.className = "assign-select" + (entry.owner ? " " + OWNER_CLASS[entry.owner] : "");
    const noneOpt = document.createElement("option");
    noneOpt.value = "";
    noneOpt.textContent = "— brak —";
    sel.appendChild(noneOpt);
    OWNERS.forEach(o => {
      const opt = document.createElement("option");
      opt.value = o;
      opt.textContent = o;
      if(entry.owner === o) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = () => {
      entry.owner = sel.value || null;
      persistState();
      render();
    };
    tdAssign.appendChild(sel);
    tr.appendChild(tdAssign);

    tbody.appendChild(tr);
  });

  renderStats(list);
}

function render(){
  renderSidebar();
  document.getElementById("nav-guide").classList.toggle("active", showGuide);

  const controlsRow = document.getElementById("controls-row");
  const statsRow = document.getElementById("stats-row");
  const tableWrap = document.getElementById("table-wrap");
  const guideView = document.getElementById("guide-view");

  if(showGuide){
    controlsRow.style.display = "none";
    statsRow.style.display = "none";
    tableWrap.style.display = "none";
    guideView.style.display = "block";
    document.getElementById("view-title").textContent = "Poradnik driftu w GTA V";
    document.getElementById("view-sub").textContent = "Jak ustawienia z LS Customs przekładają się na zachowanie auta w poślizgu";
    renderGuide();
  }else{
    controlsRow.style.display = "";
    statsRow.style.display = "";
    tableWrap.style.display = "";
    guideView.style.display = "none";
    renderTitle();
    renderTable();
  }
}

document.getElementById("nav-guide").addEventListener("click", () => {
  showGuide = true;
  render();
});

document.getElementById("reset-link").addEventListener("click", async () => {
  if(!confirm("Na pewno wyczyścić wszystkie statusy i przypisania?")) return;
  state = {};
  await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  render();
});

function openModal(car){
  const info = LOOKUP[car.name];
  const overlay = document.getElementById("modal-overlay");
  const content = document.getElementById("modal-content");

  if(!info){
    content.innerHTML = `
      <div class="modal-head">
        <h2 class="modal-title">${car.name}</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-cat">${car.category} · ocena ${car.rating.toFixed(1)}</div>
      <div class="modal-section-body">Brak jeszcze szczegółowych danych dla tego pojazdu.</div>
    `;
  }else{
    const liveryClass = info.livery.startsWith("Tak") ? "livery-yes" : "livery-no";
    content.innerHTML = `
      <div class="modal-head">
        <h2 class="modal-title">${car.name}</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-cat">${car.category} · ocena ${car.rating.toFixed(1)}</div>

      ${info.photo ? `<img class="modal-photo-img" src="${info.photo}" alt="${car.name}">` : `
      <a class="modal-photo-link" href="${info.wiki}" target="_blank" rel="noopener">
        <svg class="photo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-4 4-3-3-6 6"/></svg>
        <span>Zdjęcie nie jest jeszcze wbudowane w bazę.</span>
        <span class="photo-cta">Szukaj na GTABase ↗</span>
      </a>`}

      <div class="modal-grid">
        <div class="modal-section">
          <div class="modal-section-label">Odpowiednik IRL</div>
          <div class="modal-section-body">${info.real}</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-label">Kraj pochodzenia</div>
          <div class="modal-section-body">${info.country}</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-label">Napęd / silnik (w grze)</div>
          <div class="modal-section-body">${info.drivetrain}</div>
        </div>
        <div class="modal-section">
          <div class="modal-section-label">Okleiny / widebody</div>
          <div class="modal-section-body ${liveryClass}">${info.livery}</div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-label">Jak przerobić na drift/wyścigówkę (FiveM)</div>
        <div class="modal-section-body">${info.drift}</div>
      </div>

      <div class="modal-footnote">Dane odpowiednika IRL, napędu i oklein pochodzą z ogólnej wiedzy o grze i mogły się zmienić w aktualizacjach — zweryfikuj dokładne specyfikacje, zdjęcia i dostępność oklein w LS Customs / u Benny'ego, a także na powyższym linku do GTABase.</div>
    `;
  }

  overlay.classList.add("open");
  document.getElementById("modal-close").onclick = closeModal;
}

function closeModal(){
  document.getElementById("modal-overlay").classList.remove("open");
}

document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if(e.target.id === "modal-overlay") closeModal();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") closeModal();
});

(async function init(){
  await loadState();
  render();
})();
</script>
